# SonarCloud — copiar a la RAÍZ del repo como: sonar-project.properties
# Los dos primeros valores te los muestra sonarcloud.io al crear el proyecto
# (Administration -> General Settings). Ajústalos si cambian.

sonar.organization=feispla
sonar.projectKey=feispla_VANTSNET
sonar.projectName=VANTSNET

# Qué analizar
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Exclusiones
sonar.exclusions=**/node_modules/**,**/.next/**,**/generated/**,**/*.config.js,**/*.config.mjs
sonar.coverage.exclusions=**/demo-data.ts,**/*.config.*

# Reporte de cobertura (si añades Vitest/Jest con --coverage más adelante):
# sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Codificación
sonar.sourceEncoding=UTF-8
