# SonarCloud — copiar a la RAÍZ del repo como: sonar-project.properties
# Los dos primeros valores te los muestra sonarcloud.io al crear el proyecto
# (Administration -> General Settings). Ajústalos si cambian.

sonar.organization=feispla
sonar.projectKey=feispla_VANTSNET
sonar.projectName=VANTSNET

# Qué analizar
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Exclusiones
# migrations/ = código GENERADO por `prisma migration plan` (nunca editado a
# mano); su naturaleza repetitiva dispara falsas duplicaciones en el Quality
# Gate. Nota: si el análisis automático de la app de SonarQube Cloud sigue
# activo, añade también **/migrations/** en sonarcloud.io ->
# Administration -> Analysis Scope (la app no lee este archivo).
sonar.exclusions=**/node_modules/**,**/.next/**,**/generated/**,**/*.config.js,**/*.config.mjs,**/migrations/**
sonar.coverage.exclusions=**/demo-data.ts,**/*.config.*

# Reporte de cobertura (si añades Vitest/Jest con --coverage más adelante):
# sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Codificación
sonar.sourceEncoding=UTF-8
