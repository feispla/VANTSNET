name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo: SonarCloud necesita el blame de git
          # para calcular con precisión el "código nuevo" del Quality Gate
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build (necesario para que el análisis incluya todo el código)
        run: npm ci && npx prisma generate && npm run build

      - name: Análisis SonarCloud
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          # Secret del repo: Settings -> Secrets and variables -> Actions
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
